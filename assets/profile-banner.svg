  <rect x="78" y="82" width="142" height="7" rx="3.5" fill="url(#accent)"/>

  <text x="78" y="123" fill="#7dd3fc" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="750" letter-spacing="2.4">
