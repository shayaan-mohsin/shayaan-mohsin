  <g filter="url(#softShadow)">
    <rect x="690" y="62" width="430" height="236" rx="24" fill="url(#panel)" stroke="#26364f"/>
    <rect x="714" y="86" width="88" height="26" rx="13" fill="#0f2a3f" stroke="#256f93"/>
    <text x="758" y="104" fill="#a7f3d0" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="750" text-anchor="middle">
