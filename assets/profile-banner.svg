  <rect width="1200" height="360" fill="url(#bg)"/>

  <path d="M790 0 L1200 0 L1200 360 L650 360 Z" fill="#0d1b2d" opacity="0.72"/>
  <path d="M0 314 C210 250 352 336 560 272 C716 224 852 220 1200 282" fill="none" stroke="#1e293b" stroke-width="2" opacity="0.75"/>
  <path d="M0 330 C246 270 378 350 590 292 C762 244 902 244 1200 300" fill="none" stroke="#22324a" stroke-width="1.2" opacity="0.9"/>

  <g opacity="0.09" stroke="#e5e7eb" stroke-width="1">
    <path d="M76 60 H1124"/>
    <path d="M76 300 H1124"/>
    <path d="M76 60 V300"/>
    <path d="M1124 60 V300"/>
    <path d="M640 60 V300"/>
