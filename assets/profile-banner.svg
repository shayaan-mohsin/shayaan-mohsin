    <rect x="772" y="230" width="316" height="42" rx="14" fill="#101b2d" stroke="#5b3b18"/>
    <text x="792" y="256" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">
