    <circle cx="746" cy="144" r="5" fill="#38bdf8"/>
    <circle cx="746" cy="197" r="5" fill="#22c55e"/>
    <circle cx="746" cy="250" r="5" fill="#f59e0b"/>

    <rect x="772" y="124" width="316" height="42" rx="14" fill="#101b2d" stroke="#1e3a5f"/>
    <text x="792" y="150" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">
