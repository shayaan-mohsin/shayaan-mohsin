<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Shayaan Mohsin GitHub Profile Banner</title>
  <desc id="desc">A clean professional profile banner for Shayaan Mohsin focused on cybersecurity, GRC, risk, privacy, CTI, and security strategy.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="360" fill="url(#background)"/>
  <rect x="0" y="0" width="1200" height="360" fill="none" stroke="#1f2937" stroke-width="2"/>

  <g opacity="0.08" stroke="#e5e7eb" stroke-width="1">
    <path d="M80 72 H1120"/>
    <path d="M80 288 H1120"/>
    <path d="M80 72 V288"/>
    <path d="M1120 72 V288"/>
  </g>

  <rect x="80" y="98" width="104" height="6" rx="3" fill="url(#accent)"/>

  <text x="80" y="166" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="54" font-weight="760">
    Shayaan Mohsin
  </text>

  <text x="82" y="212" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="560">
    Cybersecurity Operations &amp; Leadership
  </text>

  <text x="82" y="252" fill="#e5e7eb" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="430">
    GRC · Cyber Risk · Privacy · CTI · Security Strategy
  </text>

  <g opacity="0.9">
    <path d="M812 178 H1090" stroke="#334155" stroke-width="1.5"/>
    <circle cx="812" cy="178" r="4" fill="#38bdf8"/>
    <circle cx="950" cy="178" r="4" fill="#22c55e"/>
    <circle cx="1090" cy="178" r="4" fill="#94a3b8"/>
  </g>
</svg>
